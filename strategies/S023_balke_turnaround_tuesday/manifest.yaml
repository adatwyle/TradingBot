notes: |
  LE STOP N'EST PAS DE LA SOURCE. Balke n'a ni SL ni TP : son risque est le
  notionnel (25 000 € par trade). `Signal.stop` étant obligatoire sur cette
  plateforme (R3), la stratégie déclare SA PROPRE règle — `guard_pct`, garde
  CATASTROPHE à 5 % sous l'entrée, jamais un stop de gestion. Le harnais compte
  les trades qui la touchent : si ce compte n'est pas quasi nul, la garde n'est
  plus une garde et la reproduction n'est plus fidèle.

  CELLULE DE RÉFÉRENCE HORS GRILLE : `sma_period: 0` = filtre désactivé — achat
  de CHAQUE lundi, même sortie. C'est le rendement 2 jours nu de l'indice ;
  il rend visible l'apport propre du filtre SMA. N'entre pas dans le décompte
  de multiplicité (ce n'est pas un candidat, c'est un étalon).

  DONNÉES : H1 serveur (Swissquote, ≈ GMT+3), 1855 jours, 2021-08-16 →
  2026-09-11. Clôture journalière DÉRIVÉE de la dernière barre H1 de chaque jour
  serveur — vérifiée identique aux barres D1 du courtier (écart médian nul sur
  1293-1331 jours). NASDAQ/US30 cotent 24/24 (+18 barres dominicales résiduelles
  sur 5 ans, comptées comme des jours complets à part entière) ; le DAX cote
  08:00-21:00, jamais le dimanche.

  SPREAD : catalogue DAX 8 / NASDAQ 8 / US30 35 pips ; mesuré sur les barres
  (365 j) DAX 23 / NASDAQ 12 / US30 35. Les deux sont rapportés — cf.
  docs/data/INDICES_intraday_2026-09-12.md et ticket TCK-018.
