# ATTENTION — CONTRAT NON STANDARD
# Cette stratégie implémente `AllocationModule` (core/contracts/allocation.py),
# PAS `StrategyModule`. Elle répartit un capital entre plusieurs lignes ; elle
# n'émet ni entrée, ni stop, ni cible. Conséquences pour la plateforme :
#   - `python -m core.validation.causality --strategy s07_ionita_gaussian`
#     NE FONCTIONNE PAS (le CLI est câblé sur le contrat épisodique).
