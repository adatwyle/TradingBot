# ── Source de l'hypothèse ────────────────────────────────────────────────────
source: "docs/sources/moneytalk/ — MoneyTalk #29 (Cindy « Doud Trading », 2026-06-13)"
source_synthese: docs/sources/moneytalk/SYNTHESE.md

# ── Grille : 5 commutateurs binaires = 32 cellules ───────────────────────────
# La cellule (breakout, extremes, both, off, off) reproduit la v1 au signal près
# — vérifié par test_strategy.py. À 5 %, ≈ 1,6 « pass » attendue par hasard.
param_grid:
  entry_mode:     [breakout, equilibrium]     # D4 — « récupérer le milieu » (@ 18:08)
  channel_source: [extremes, bodies]          # D3 — « structure, pas mèche » (@ 17:52)
  side_mode:      [both, long_only]           # D1 — « je vends quasiment jamais » (@ 21:52)
  session_filter: [off, doud]                 # D5 — US + Asie, jamais Londres (@ 35:35)
  htf_bias:       [off, daily_ema]            # D2 — biais avant le chart (@ 23:32)

default_params:
  # défauts = comportement v1
  entry_mode: breakout
  channel_source: extremes
  side_mode: both
  session_filter: "off"
  htf_bias: "off"
  # socle figé aux valeurs de la cellule scellée du forward v1
  donchian: 40
  adx_min: 20.0
  tp_m: 4.0
  sl_m: 1.5
  atr_vol_ratio: 0.8
  adx_rising_lookback: 5
  rsi_long_max: 75.0
  rsi_short_min: 25.0

created: 2026-09-06
notes: |
  Constantes hors grille, délibérément : EQUILIBRIUM_RATIO = 0,5 (« le milieu »
  est l'hypothèse, pas un réglage), PULLBACK_MAX_BARS = 24 (une journée H1),
  HTF_EMA_DAYS = 20. Les faire varier testerait un autre énoncé que celui de la
  source et gonflerait la grille sans rien trancher.

  Non repris de la source, et pourquoi : sorties partielles, stop suiveur et
  break-even « qui finance les frais » supposent un moteur qui déplace un stop —
  le moteur commun ne le fait pas et R9 interdit d'en écrire un autre. Absence
  de stop et renforcement à la baisse : refusés par R3.
