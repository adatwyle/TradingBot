notes: |
  CE N'EST PAS UN PROTOCOLE SCELLÉ, ET ÇA NE PEUT PAS L'ÊTRE AUJOURD'HUI.
  Trois des quatre entrées ont une valeur INCONNUE :
    · sentiment      — s14 en collecte, F1 au plus tôt 2026-10-17, valeur nulle
                       démontrée à ce jour ;
    · anticipations  — s15 (COT) EN SUSPENS (2-9 épisodes de hold-out contre un
                       plancher dérivé de 12) ; marchés prédictifs : RIEN
                       n'existe (ni collecteur, ni historique, ni mesure) ;
    · avis de Claude — mesuré : NE PAS ARMER (percentile 95,6 groupé qui tombe
                       à 90,0 stratifié ; trades pris toujours perdants à
                       −0,065 R).
  Sceller une combinaison sur des entrées qui bougent sous le protocole
  reviendrait à sceller sur rien. CONDITION DE SCELLEMENT, écrite d'avance :
  au moins 2 des 3 conseils ont un verdict RENDU (VALEUR CANDIDATE ou PAS DE
  VALEUR — pas « en cours »). Détail : research/ANALYSIS.md §G.1.

  LA REVENDICATION TESTABLE N'EST PAS « le score marche » MAIS « le score est
  CALIBRÉ » : quand le système annonce X %, l'événement déclaré se produit X %
  du temps. Événement figé d'avance et BINAIRE — « le trade atteint sa cible
  avant son stop », à géométrie de sortie CONSTANTE (sinon la calibration
  mesure la sortie, pas la lecture). Instruments : courbe de fiabilité avec
  effectif par tranche, score de Brier et sa décomposition (fiabilité /
  résolution / incertitude), témoin obligatoire = le score constant, qui est
  parfaitement calibré et parfaitement inutile.

  EFFECTIF DE CALIBRATION, DÉRIVÉ (n = (z/2e)², z = 1,96, p ≈ 0,5) :
    ± 5   pts → 384/tranche × 5 tranches = 1 920 trades ≈ 17 ans
    ± 8,5 pts → 133/tranche × 3 tranches =   399 trades ≈ 3,5 ans
    ± 10  pts →  96/tranche × 2 tranches =   192 trades ≈ 1,7 an
  à la cadence MESURÉE de 2,2 trades/semaine (livre complet). En forex seul la
  cadence mesurée tombe à 0,63/semaine — sous le plancher de 1 demandé.
  => NOMBRE DE TRANCHES FIGÉ À 3 AU MAXIMUM, décidé avant d'avoir vu la moindre
  confiance produite.

  ARCHITECTURE DE MESURE (constructible dès maintenant, généralise
  macd_ai_paper) : bras parallèles A0 MECH (référence, À VIE) / A1 +sentiment /
  A2 +anticipations / A3 +Claude / A4 combiné / A5 aléatoire au taux de prise
  de A4, plus SHADOW (contrefactuel sur CHAQUE signal). SHADOW n'est pas un
  confort : sans lui les tranches de confiance des trades non pris restent
  vides et la calibration est INOBSERVABLE. Bras dont le taux de prise sort de
  [0,10 ; 0,90] → déclaré NON INFORMATIF.

  GESTION DE SORTIE : SORTIE DE CE DOSSIER. Elle ne dépend d'aucun des quatre
  piliers et est mesurable aujourd'hui — étude autonome proposée (s17), avec un
  préalable de plateforme vérifié : core/backtest/engine.py n'implémente AUCUNE
  gestion dynamique (stop et cible constants pour la durée du trade), et
  pulse/live_runner.py n'émet que des TRADE_ACTION_DEAL — aucune voie pour
  modifier un ordre déjà chez le broker (R3, set & forget). Toute sortie
  dynamique est donc une capacité du MOTEUR, ticket core/ séparé, avec stop
  MONOTONE pour préserver R3.

  RÉGIME VISÉ — avertissement : le swing « sur les tendances générales » est le
  régime réfuté quatre fois sur ce dépôt (S2 cassure, S5 pullback, s13 famille
  B croisements, s12 momentum). S1 en H4 : 0/11 paires. Les seules poches
  positives jamais mesurées sont des RETOURS À LA MOYENNE.

  Aucun ordre, aucun compte, aucun capital sur Polymarket, Kalshi ou toute
  autre place prédictive : LECTURE SEULE, conformément au mandat.
  Aucune promotion PAPER ou LIVE — R10, décision d'Adrian.
