# ── Règle, telle que le guide d'entrées la décrit ────────────────────────────
# Sur chaque bougie CLOSE de l'unité de signal :
#   amplitude (haut − bas) > ATR Multiplier × ATR(ATR Period), l'ATR étant calculé
#   sur les barres strictement antérieures (décalage 1) ;
#   la bougie ferme à moins de `Close proximity` % de son amplitude de son extrême —
#   du haut pour un achat, du bas pour une vente ; on suit son sens ;
#   corps/amplitude ≥ `Min body-to-range` (0 = filtre désactivé) ;
#   stop et cible = pourcentage du prix d'entrée ; une position par symbole.
# Filtres optionnels de l'EA (tendance MA HTF, ATR multi-unités, fenêtre horaire,
# support/résistance) : TOUS DÉSACTIVÉS dans son live → non implémentés.
# Trailing : désactivé dans son live → non implémenté.

# ── Réglages live de l'auteur = default_params ───────────────────────────────
# « H1, ATR 200, × 2,5, clôture dans le quart extrême (25 %), filtres tous
# désactivés, TP 2 %, SL 0,5 % (RR 4), risque 100 € » (relevé 2026-09-12 § 2.4).
# `min_body_ratio` : valeur live non dite → 0 (désactivé), hypothèse fidèle déclarée.

# ── Grille : 12 cellules ─────────────────────────────────────────────────────
# Autour de ses valeurs live. `atr_period` (200) et `tp_pct` (2 %) NE SONT PAS
# balayés : ce sont ses réglages dictés, les balayer ferait du réglage, pas de
# la reproduction. À 5 %, ≈ 0,6 réussite attendue par pur hasard.
param_grid:
  atr_mult: [2.0, 2.5, 3.0]
  proximity: [0.25, 0.35]
  sl_pct: [0.005, 0.01]

default_params:
  atr_period: 200
  atr_mult: 2.5
  proximity: 0.25
  tp_pct: 0.02
  sl_pct: 0.005
  min_body_ratio: 0.0
  atr_mode: sma               # iATR de MT5 = moyenne SIMPLE du True Range
  side_mode: both

created: 2026-09-12
notes: |
  RÉFÉRENCES PUBLIÉES À CONFRONTER (test de fidélité, cf. research/FALSIFICATION.md) :
  backtest 11 ans sur or, tick réel Dukascopy (561 M ticks, qualité 100 %) —
  1 552 trades (≈ 141/an), taux de réussite ≈ 23 %, profit factor 1,15,
  +19 527 € sur 50 000 €, drawdown max ≈ 9,6 %. Live depuis mars 2026 :
  24 trades +515,65 € contre 23 trades +634,03 € au testeur sur la même fenêtre
  (WR 25,0 % contre 26,1 %, DD 1 139 € contre 1 028 €). Son propre journal donne
  par ailleurs 55 trades, WR < 30 %, gain moyen 370 € pour 90 € de perte moyenne.

  AMBIGUÏTÉ DE DISPOSITIF DÉCLARÉE : l'iATR de MT5 est une moyenne SIMPLE du True
  Range, l'ATR de Wilder est un lissage récursif. `atr_mode: sma` est le défaut
  fidèle (c'est l'indicateur que l'EA appelle) ; `wilder` existe HORS GRILLE comme
  seul outil de diagnostic si la fidélité en fréquence ou en taux de réussite
  s'écarte fortement de ses chiffres publiés. Ce n'est pas un réglage. Écart
  transitoire assumé sur cette branche : la récurrence est amorcée sur TR[0]
  (`ewm(adjust=False)`) et non sur la moyenne simple des P premiers True Range du
  Wilder canonique ; l'écart décroît en (1 − 1/P)^n et ne touche que le préchauffage.

  SENS DE LA BOUGIE — interprétation déclarée : « close near its own extreme » n'exige
  pas explicitement une bougie haussière pour un achat ; nous demandons close > open
  (achat) et close < open (vente), au titre de « trades in the direction of that
  breakout ». Mesuré : 21 bougies outlier écartées sur les 857 qui ferment près d'un
  extrême (2,5 %) — sans effet sur les conclusions.

  RÈGLES PROPRES (doctrine Adrian 2026-09-12) : S022 déclare **pas de coupe-circuit**.
  À 23 % de réussite, trois pertes consécutives surviennent une fois sur deux
  (0,77³ ≈ 46 %) : un coupe-circuit commun à 3 pertes couperait la règle et non le
  risque. Le bras « règles communes » (refroidissement 2, coupe-circuit 3 → 24
  barres) est mesuré À CÔTÉ, pour information, sur la cellule par défaut.

  DONNÉES : XAUUSD H1, 6 ans de cache MT5 (≈ 35 400 barres). Spread catalogue
  25 pips ; spread médian réellement coté sur les 12 derniers mois ≈ 90 pips —
  les deux sont mesurés, et c'est le second qui fait foi pour la décision.
