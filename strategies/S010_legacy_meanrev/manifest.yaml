strategy_id: s10_legacy_meanrev
display_name: "Legacy S1 — divergence MACD + S/R"
version: "1.0.0"
magic_number: 130010
author: "claude:s10_legacy_meanrev"
source: "projet TBOT 2026, historique (grid_search_v12_multi_variant.py)"
trader: "TBOT interne"

# BACKTESTED = « mesuré », PAS « validé ». Verdict : PAS D'EDGE sur 7 des 8
# instruments, NON CONCLUSIF sur NIKKEI. Ne pas promouvoir en PAPER.
status: BACKTESTED

symbols:
  - SP500       # 1er du portefeuille contaminé (+244 CHF/fenêtre) -> 0/108 STRICT ici
  - NIKKEI      # seul résidu non écarté — NON CONCLUSIF
  - FTSE        # 3e du portefeuille contaminé (+108) -> 0/108 STRICT ici
  - AUDCHF      # 4e du portefeuille contaminé (+98)
  - EURUSD
  - EURCHF
  - AUDUSD
  - USDJPY      # 0/210 dans le run contaminé — contrôle négatif

timeframe: H1
warmup_bars: 300

default_params:
  variant: DIV_SR
  rsi_band: 35
  adx_max: 35
  sl_atr: 2.0
  rr: 2.0

# 3 x 3 x 3 x 2 x 2 = 108 configurations.
# `variant` = les 3 chemins de code RÉELS des 6 variantes historiques
# (STRICT / WIDE_TOL / RSI40 partagent la même branche, HI_cons / HI_aggr aussi).
# `rsi_band` = borne basse ; la borne haute vaut 100 - borne basse.
# `rr` = TP exprimé en multiple du SL (TP_atr = rr * sl_atr).
param_grid:
  variant:  [DIV_SR, DIV_NOSR, HIST_INF]
  rsi_band: [30, 35, 40]
  adx_max:  [25, 35, 50]
  sl_atr:   [1.5, 2.5]
  rr:       [1.0, 2.0]

# Fixés hors grille, arrêtés en Phase 1 AVANT tout résultat.
fixed_constants:
  macd: "12/26/9, signal en SMA (comportement MT5 iMACD)"
  rsi_period: 14
  adx_period: 14         # algorithme MT5 ADX.mq5, pas la variante Wilder
  atr_period: 14
  sr_lookback: 50
  sr_swing: 5
  sr_tol: 0.006
  div_k: 5
  div_gap: "5 à 50 barres"
  div_hold: 6

created: 2026-08-16
notes: |
